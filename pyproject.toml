[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whsmooth"
version = "0.1.0"
description = "Whittaker-Henderson smoothing for P&C ratemaking and actuarial graduation — 1D, 2D, automatic lambda selection (GCV/REML/AIC)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Isaac López", email = "isaaclopg@gmail.com" },
]
keywords = [
    "actuarial",
    "p&c",
    "non-life",
    "ratemaking",
    "pricing",
    "smoothing",
    "whittaker-henderson",
    "graduation",
    "loss-development",
    "severity",
    "gcv",
    "reml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/CosmikArt/whsmooth"
Repository = "https://github.com/CosmikArt/whsmooth"
Issues = "https://github.com/CosmikArt/whsmooth/issues"
Documentation = "https://github.com/CosmikArt/whsmooth#readme"
Changelog = "https://github.com/CosmikArt/whsmooth/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/whsmooth"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
